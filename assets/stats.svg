<svg width="820" height="260" viewBox="0 0 820 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes igniteBlade {
      0% { transform: scaleY(0); opacity: 0.3; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px #ff1e27) drop-shadow(0 0 18px #d90429); }
      50% { filter: drop-shadow(0 0 14px #ff1e27) drop-shadow(0 0 28px #ff002b); }
    }
    @keyframes revealText {
      0% { opacity: 0; transform: translateX(-14px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .blade {
      transform-origin: 68px 202px;
      animation: igniteBlade 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards, pulseGlow 2s infinite alternate;
    }
    .row-1 { opacity: 0; animation: revealText 0.55s ease-out 0.30s forwards; }
    .row-2 { opacity: 0; animation: revealText 0.55s ease-out 0.48s forwards; }
    .row-3 { opacity: 0; animation: revealText 0.55s ease-out 0.66s forwards; }
    .row-4 { opacity: 0; animation: revealText 0.55s ease-out 0.84s forwards; }
    .row-5 { opacity: 0; animation: revealText 0.55s ease-out 1.02s forwards; }
    .title { font-family: 'Segoe UI', Orbitron, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 1.8px; }
    .label { font-family: 'Consolas', monospace; font-size: 13.5px; fill: #ff2a38; font-weight: bold; }
    .val { font-family: 'Consolas', monospace; font-size: 13.5px; fill: #e5e5e5; }
  </style>

  
  <rect x="2" y="2" width="816" height="256" rx="14" fill="#090A0F" stroke="#8D0801" stroke-width="2" />
  <line x1="126" y1="20" x2="126" y2="240" stroke="#1F242D" stroke-width="1" stroke-dasharray="4 4" />

  
  <rect x="60" y="202" width="16" height="40" rx="3" fill="#2B2D42" stroke="#8D99AE" stroke-width="1.5" />
  <rect x="58" y="210" width="20" height="5" fill="#111111" />
  <rect x="58" y="222" width="20" height="5" fill="#111111" />
  <circle cx="68" cy="233" r="2.5" fill="#FF1E27" />
  <path d="M56 202 L80 202 L76 194 L60 194 Z" fill="#8D99AE" />

  
  <g class="blade">
    <rect x="62" y="24" width="12" height="172" rx="6" fill="#FF1E27" opacity="0.88" />
    <rect x="65" y="27" width="6" height="168" rx="3" fill="#FFFFFF" />
  </g>

  
  <text x="152" y="42" font-size="16.5" class="title">IMPERIAL HOLONET TELEMETRY // VIHAAN RAWAT</text>
  <line x1="152" y1="53" x2="780" y2="53" stroke="#8D0801" stroke-width="1.5" />

  <g class="row-1">
    <text x="152" y="82" class="label">[ACADEMY_SECTOR]</text>
    <text x="330" y="82" class="val">B.Tech CSE @ MAIT New Delhi (2025–2029) | CGPA: 9.10/10</text>
  </g>

  <g class="row-2">
    <text x="152" y="114" class="label">[COMBAT_TRAINING]</text>
    <text x="330" y="114" class="val">LeetCode (vr-star): 350+ Solved | 1,500+ Rating | 300-Day Badge</text>
  </g>

  <g class="row-3">
    <text x="152" y="146" class="label">[CORE_ARSENAL]</text>
    <text x="330" y="146" class="val">C++ (STL), TypeScript, JavaScript, Python, SQL</text>
  </g>

  <g class="row-4">
    <text x="152" y="178" class="label">[SYSTEM_ENGINES]</text>
    <text x="330" y="178" class="val">React, Next.js, Node.js, Express, MongoDB, Socket.IO, Docker</text>
  </g>

  <g class="row-5">
    <text x="152" y="210" class="label">[ACTIVE_FLEET]</text>
    <text x="330" y="210" class="val">Relay · Travel Tales · Burrow Chrome Extension (MV3)</text>
  </g>
</svg>
