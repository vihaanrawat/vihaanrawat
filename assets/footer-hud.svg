<svg width="840" height="115" viewBox="0 0 840 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes glideShip {
      0% { transform: translateX(-230px); }
      100% { transform: translateX(920px); }
    }
    @keyframes enginePulse {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 6px #ff1e27); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #ff1e27); }
    }
    @keyframes starDrift {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-120px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .destroyer {
      animation: glideShip 16s linear infinite;
    }
    .thrusters {
      animation: enginePulse 1.4s ease-in-out infinite;
    }
    .stars {
      animation: starDrift 12s linear infinite;
    }
    .dot {
      animation: blink 2.2s ease-in-out infinite;
    }
    .hud {
      font-family: 'Consolas', monospace;
      font-size: 10.5px;
      fill: #6B7280;
      letter-spacing: 2px;
    }
  </style>

  <defs>
    <clipPath id="frameClip">
      <rect x="2" y="2" width="836" height="111" rx="14" />
    </clipPath>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="65%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="upperDeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="exhaustTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  
  <rect x="2" y="2" width="836" height="111" rx="14" fill="#090A0F" stroke="#1F2937" stroke-width="1.5" />

  <g clip-path="url(#frameClip)">
    
    <g class="stars" fill="#94A3B8">
      <circle cx="90" cy="24" r="1" opacity="0.5" />
      <circle cx="210" cy="78" r="1.2" opacity="0.4" />
      <circle cx="340" cy="30" r="0.9" opacity="0.6" />
      <circle cx="480" cy="86" r="1.1" opacity="0.35" />
      <circle cx="610" cy="26" r="1.3" opacity="0.5" />
      <circle cx="750" cy="72" r="1" opacity="0.45" />
      <circle cx="880" cy="34" r="1.2" opacity="0.55" />
      <line x1="150" y1="45" x2="175" y2="45" stroke="#1E293B" stroke-width="1" />
      <line x1="520" y1="62" x2="555" y2="62" stroke="#1E293B" stroke-width="1" />
      <line x1="790" y1="40" x2="820" y2="40" stroke="#1E293B" stroke-width="1" />
    </g>

    
    <g class="destroyer">
      
      <g class="thrusters">
        <polygon points="-45,51 8,49 8,53" fill="url(#exhaustTrail)" />
        <polygon points="-58,57 6,54.5 6,59.5" fill="url(#exhaustTrail)" />
        <polygon points="-45,63 8,61 8,65" fill="url(#exhaustTrail)" />
        
        <rect x="4" y="48.5" width="5" height="4.5" rx="1" fill="#FFFFFF" />
        <rect x="2" y="54" width="6" height="5.5" rx="1" fill="#FFFFFF" />
        <rect x="4" y="60.5" width="5" height="4.5" rx="1" fill="#FFFFFF" />
      </g>

      
      <polygon points="8,36 185,57 8,78 16,57" fill="url(#hullGrad)" stroke="#475569" stroke-width="0.8" />
      
      
      <line x1="16" y1="57" x2="185" y2="57" stroke="#94A3B8" stroke-width="0.8" opacity="0.7" />

      
      <polygon points="18,45 112,57 18,69 24,57" fill="url(#upperDeck)" stroke="#64748B" stroke-width="0.6" />
      <polygon points="24,50 75,57 24,64" fill="#1E293B" stroke="#94A3B8" stroke-width="0.5" />

      
      <rect x="20" y="52" width="9" height="10" rx="1" fill="#334155" stroke="#94A3B8" stroke-width="0.7" />
      <circle cx="23" cy="54" r="1.4" fill="#EF4444" />
      <circle cx="23" cy="60" r="1.4" fill="#EF4444" />

      
      <line x1="55" y1="44" x2="55" y2="70" stroke="#0F172A" stroke-width="0.8" opacity="0.6" />
      <line x1="95" y1="49" x2="95" y2="65" stroke="#0F172A" stroke-width="0.8" opacity="0.6" />
      <line x1="135" y1="53" x2="135" y2="61" stroke="#0F172A" stroke-width="0.8" opacity="0.6" />
    </g>
  </g>

  
  <circle cx="24" cy="20" r="2.8" fill="#EF4444" class="dot" />
  <text x="35" y="23.5" class="hud">IMPERIAL_FLEET // SECTOR_01</text>
  <text x="816" y="23.5" text-anchor="end" class="hud">VIHAANRAWAT.DEV</text>

  <text x="420" y="101" text-anchor="middle" class="hud">"ENGINEERING THE ARCHITECTURE OF IDEAS"</text>
</svg>
