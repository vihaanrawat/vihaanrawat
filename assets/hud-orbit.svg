<svg width="840" height="260" viewBox="0 0 840 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.95; }
    }
    @keyframes signal {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 40px; opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .scanner { transform-origin: 110px 130px; animation: sweep 8s linear infinite; }
    .pulse-glow { animation: pulse 2.5s infinite ease-in-out; }
    .sig-ring { transform-origin: 110px 130px; animation: signal 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
    .floating-nodes { animation: float 6s infinite ease-in-out; }
    .node { transition: fill 0.3s; cursor: pointer; }
    .node:hover { fill: #FF334B; }
    .text-title { font-family: 'Segoe UI', Orbitron, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
    .hud-text { font-family: 'Consolas', monospace; font-size: 11px; fill: #FF334B; }
    .stack-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #A5B4FC; }
    .conn-line { stroke: #1F2937; stroke-dasharray: 2 4; }
  </style>

  
  <rect x="2" y="2" width="836" height="256" rx="16" fill="#090A0F" stroke="#1F2937" stroke-width="2.5" />

  
  <path d="M 0,40 H 840 M 0,80 H 840 M 0,120 H 840 M 0,160 H 840 M 0,200 H 840" stroke="#111827" stroke-width="1" />
  <path d="M 110,0 V 260 M 240,0 V 260 M 380,0 V 260 M 520,0 V 260 M 660,0 V 260" stroke="#111827" stroke-width="1" />

  
  <circle cx="110" cy="130" r="85" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="110" cy="130" r="55" stroke="#374151" stroke-width="1" stroke-dasharray="8 4" />
  <circle cx="110" cy="130" r="25" stroke="#EF4444" stroke-width="1" opacity="0.4" />
  
  <circle cx="110" cy="130" r="10" class="sig-ring" stroke="#EF4444" stroke-width="1" />
  <line x1="110" y1="130" x2="110" y2="45" class="scanner" stroke="#EF4444" stroke-width="2" opacity="0.75" />
  <circle cx="110" cy="130" r="4" fill="#EF4444" class="pulse-glow" />

  <text x="32" y="32" class="hud-text" font-weight="bold">HUD // SYSTEM_RADAR</text>

  
  
  <path d="M 330,90 L 450,60 L 580,60 L 710,95 L 670,140 L 560,135 L 430,140 Z" class="conn-line" />
  <path d="M 430,140 L 350,185 L 480,210 L 610,210 L 670,140 Z" class="conn-line" />
  <path d="M 450,60 L 430,140 L 480,210" class="conn-line" />
  <path d="M 580,60 L 560,135 L 610,210" class="conn-line" />

  <g class="floating-nodes">
    
    <g transform="translate(330, 90)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -8,-6 L -4,-6 L -4,-8 L -2,-8 L -2,-6 L 2,-6 L 2,-4 L -2,-4 L -2,-2 L -4,-2 L -4,-4 L -8,-4 Z M -1,-2 L 1,-2 L 1,-3 L 2,-3 L 2,-2 L 4,-2 L 4,-1 L 2,-1 L 2,1 L 1,1 L 1,-1 L -1,-1 Z" fill="#EF4444" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">C++</text>
    </g>

    <g transform="translate(450, 60)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -8,4 L -2,4 L -2,8 L -8,8 Z M 0,4 L 6,4 L 6,8 L 0,8 Z" fill="#3178C6" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">TS</text>
    </g>

    <g transform="translate(580, 60)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -6,-4 L -2,-4 L -2,8 L -6,8 Z" fill="#F7DF1E" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">JS</text>
    </g>

    <g transform="translate(710, 95)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -4,-8 L 2,-8 L 2,-5 L -1,-5 L -1,-2 L -4,-2 Z" fill="#3776AB" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">Python</text>
    </g>

    
    <g transform="translate(430, 140)">
      <circle r="22" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" class="pulse-glow" />
      
      <ellipse rx="14" ry="5" transform="rotate(30)" stroke="#14B8A6" fill="none" stroke-width="1" />
      <ellipse rx="14" ry="5" transform="rotate(90)" stroke="#14B8A6" fill="none" stroke-width="1" />
      <ellipse rx="14" ry="5" transform="rotate(150)" stroke="#14B8A6" fill="none" stroke-width="1" />
      <circle r="2" fill="#14B8A6" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">React</text>
    </g>

    <g transform="translate(560, 135)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -7,7 L 7,-7 M 1,7 L 7,1" stroke="#FFFFFF" stroke-width="2" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">Next.js</text>
    </g>

    <g transform="translate(670, 140)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M 0,-8 L 7,-4 L 7,4 L 0,8 L -7,4 L -7,-4 Z" fill="#339933" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">Node</text>
    </g>

    
    <g transform="translate(350, 185)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <rect x="-6" y="-6" width="12" height="6" fill="#2496ED" rx="1" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">Docker</text>
    </g>

    <g transform="translate(480, 210)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#FFFFFF" font-family="monospace">EX</text>
      <text x="0" y="32" text-anchor="middle" class="stack-text">Express</text>
    </g>

    <g transform="translate(610, 210)">
      <circle r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      
      <path d="M -1,-8 C 3,-4 3,4 -1,8 C -5,4 -5,-4 -1,-8" fill="#47A248" />
      <text x="0" y="32" text-anchor="middle" class="stack-text">Mongo</text>
    </g>
  </g>

  
  <text x="310" y="28" font-size="14" class="text-title">ORBITAL TECH_STACK // ACTIVE MAP</text>
  <line x1="310" y1="36" x2="800" y2="36" stroke="#EF4444" stroke-width="1" />
</svg>
